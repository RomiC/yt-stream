name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH, got: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish stream image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/Dockerfile.bun
          platforms: linux/amd64
          push: true
          build-args: |
            SERVICE=stream
            APK_PACKAGES=ffmpeg=8.1.2-r0 streamlink=8.4.0-r0
          tags: |
            ghcr.io/romic/yt-stream-stream:${{ steps.meta.outputs.version }}
            ghcr.io/romic/yt-stream-stream:sha-${{ steps.meta.outputs.commit }}

      - name: Build and publish health image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/Dockerfile.bun
          platforms: linux/amd64
          push: true
          build-args: |
            SERVICE=health
          tags: |
            ghcr.io/romic/yt-stream-health:${{ steps.meta.outputs.version }}
            ghcr.io/romic/yt-stream-health:sha-${{ steps.meta.outputs.commit }}
