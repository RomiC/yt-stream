name: yt-stream

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - stream-service
      - icecast
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  icecast:
    image: moul/icecast@sha256:b35cd6367327335b51b989c277e6feaff7cd61d65846ec7fee361c6eb1cea620
    platform: linux/amd64
    volumes:
      - ./icecast.xml:/icecast.xml:ro
    environment:
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-secret}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-admin}"
      ICECAST_HOSTNAME: "${ICECAST_HOSTNAME:-localhost}"
      ICECAST_MAX_LISTENERS: "${ICECAST_MAX_LISTENERS:-2}"
    # Copy into the writable location first (the entrypoint's sed -i cannot
    # rename over a bind mount); apply the cap — start.sh only seds credentials.
    command: >-
      sh -c "cp /icecast.xml /etc/icecast2/icecast.xml &&
      sed -i \"s|<max-listeners>[^<]*</max-listeners>|<max-listeners>$${ICECAST_MAX_LISTENERS}</max-listeners>|g\" /etc/icecast2/icecast.xml &&
      exec /start.sh"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

  stream-service:
    build: .
    image: yt-stream:latest
    volumes:
      - stream-data:/app/data
      - ./proxy.json:/app/proxy.json:ro
    environment:
      PORT: "8080"
      ICECAST_HOST: icecast
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-secret}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-admin}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
      API_KEY: "${API_KEY:-}"
      ALLOW_KEY_IN_QUERY: "${ALLOW_KEY_IN_QUERY:-false}"
      DATA_DIR: /app/data
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      STREAM_TTL_MINUTES: "${STREAM_TTL_MINUTES:-15}"
      PROXY_FILE: "${PROXY_FILE:-}"
      STREAMLINK_QUALITY: "${STREAMLINK_QUALITY:-audio_only,worst}"
    restart: unless-stopped
    depends_on:
      - icecast
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

volumes:
  stream-data:
  caddy-data:
  caddy-config:
