name: yt-stream

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - stream-service
      - icecast
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  icecast:
    image: moul/icecast@sha256:b35cd6367327335b51b989c277e6feaff7cd61d65846ec7fee361c6eb1cea620
    platform: linux/amd64
    volumes:
      - ./icecast.xml:/icecast.xml:ro
    environment:
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-secret}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-admin}"
      ICECAST_HOSTNAME: "${ICECAST_HOSTNAME:-localhost}"
      ICECAST_MAX_LISTENERS: "${ICECAST_MAX_LISTENERS:-2}"
    # Read-only rootfs: config is copied to a tmpfs /tmp and patched there
    # (the bind mount is ro; /etc/icecast2 must stay intact — /usr/share/icecast2
    # web/admin files are symlinks into it). /start.sh is unusable under
    # cap_drop: ALL (its sudo user-switch needs CAP_SETUID), so exec icecast2
    # directly as the image's icecast2 user (101:102) — port 8000 is unprivileged.
    command: >-
      sh -c "cp /icecast.xml /tmp/icecast.xml &&
      sed -i
      -e \"s|<source-password>[^<]*</source-password>|<source-password>$${ICECAST_SOURCE_PASSWORD}</source-password>|\"
      -e \"s|<relay-password>[^<]*</relay-password>|<relay-password></relay-password>|\"
      -e \"s|<admin-password>[^<]*</admin-password>|<admin-password>$${ICECAST_ADMIN_PASSWORD}</admin-password>|\"
      -e \"s|<hostname>[^<]*</hostname>|<hostname>$${ICECAST_HOSTNAME}</hostname>|\"
      -e \"s|<max-listeners>[^<]*</max-listeners>|<max-listeners>$${ICECAST_MAX_LISTENERS}</max-listeners>|g\"
      /tmp/icecast.xml &&
      exec /usr/bin/icecast2 -c /tmp/icecast.xml"
    user: "101:102"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=102,mode=0750,size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

  stream-service:
    build: .
    image: yt-stream:latest
    volumes:
      - stream-data:/app/data
      - ./proxy.json:/app/proxy.json:ro
    environment:
      PORT: "8080"
      ICECAST_HOST: icecast
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-secret}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-admin}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
      API_KEY: "${API_KEY:-}"
      ALLOW_KEY_IN_QUERY: "${ALLOW_KEY_IN_QUERY:-false}"
      DATA_DIR: /app/data
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      STREAM_TTL_MINUTES: "${STREAM_TTL_MINUTES:-15}"
      PROXY_FILE: "${PROXY_FILE:-}"
      STREAMLINK_QUALITY: "${STREAMLINK_QUALITY:-audio_only,worst}"
    restart: unless-stopped
    depends_on:
      - icecast
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

volumes:
  stream-data:
  caddy-data:
  caddy-config:
